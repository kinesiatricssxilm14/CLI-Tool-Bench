name: Secret scan

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check working tree for credentials
        run: python3 check_no_secrets.py
      - name: Check every commit reachable from this ref
        run: |
          set -euo pipefail
          fail=0
          while read -r blob; do
            if git cat-file blob "$blob" 2>/dev/null \
              | LC_ALL=C grep -aqE '"api_key"[[:space:]]*:[[:space:]]*"[^"]{8,}"|/data00/home/[a-zA-Z0-9._-]+'; then
              echo "::error::blob $blob contains a credential or internal host path"
              fail=1
            fi
          done < <(git rev-list --objects --all \
                   | awk '{print $1}' | sort -u \
                   | git cat-file --batch-check='%(objecttype) %(objectname)' \
                   | awk '$1=="blob"{print $2}')
          exit "$fail"
