[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mp4analyzer"
version = "1.0.0"
description = "A CLI tool for analyzing MP4 files"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
mp4analyzer = "mp4analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
