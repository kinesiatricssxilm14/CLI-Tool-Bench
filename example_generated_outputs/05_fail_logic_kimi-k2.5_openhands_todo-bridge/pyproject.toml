[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-bridge"
version = "1.0.0"
description = "Convert to-do lists from CSV, Markdown, and Todo.txt into structured JSON"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
todo-bridge = "todo_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["todo_bridge*"]
